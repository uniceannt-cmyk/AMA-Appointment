<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Office</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="registrar.css">
  </head>

  <body>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <i class="fas fa-moon"></i>
    </button>

    <header>
      <h1>Registrar Office</h1>
      <nav>
        <a href="homepage.php">Home</a>
        <a href="">Logout</a>
      </nav>
    </header>

    <section class="services">
      <h2>Available Services</h2>
      <div class="service-list">
        <div class="service-card">Enrollnment Verification</div>
        <div class="service-card">Transcript Request</div>
        <div class="service-card">Student Records Update</div>
        <div class="service-card">Certificate of Enrollnment</div>
      </div>
    </section>

    <section class="booking">
      <h2>Book an Appointment</h2>
      <form method="post" action="book_appointment.php">
        
        <label for="service">Select Service:</label>
        <select name="service" id="service" required>
          <option value="Enrollment Verification">Enrollment Verification</option>
          <option value="Transcript Request">Transcript Request</option>
          <option value="Student Records Update">Student Records Update</option>
          <option value="Certificate of Enrollment">Certificate of Enrollment</option>
        </select>
        <label for="date">Choose Date:</label>
        <input type="date" name="date" id="date" class="date-time" required>

        <label for="time">Choose Time:</label>
        <select name="time" id="time" class="date-time" required>
          <option value="">Select time</option>
          <option value="08:00">8:00 AM</option>
          <option value="08:30">8:30 AM</option>
          <option value="09:00">9:00 AM</option>
          <option value="09:30">9:30 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="10:30">10:30 AM</option>
          <option value="11:00">11:00 AM</option>
          <option value="11:30">11:30 AM</option>
          <option value="12:00">12:00 PM</option>
          <option value="12:30">12:30 PM</option>
          <option value="13:00">1:00 PM</option>
          <option value="13:30">1:30 PM</option>
          <option value="14:00">2:00 PM</option>
          <option value="14:30">2:30 PM</option>
          <option value="15:00">3:00 PM</option>
          <option value="15:30">3:30 PM</option>
          <option value="16:00">4:00 PM</option>
          <option value="16:30">4:30 PM</option>
          <option value="17:00">5:00 PM</option>
        </select>

        <input type="hidden" name="office" value="registrar">
        <button type="submit">Confirm Appointment</button>
      </form>
    </section>

    <script>
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        const icon = themeToggle.querySelector('i');
        if (icon) {
          icon.classList.toggle('fa-sun', savedTheme === 'dark');
          icon.classList.toggle('fa-moon', savedTheme !== 'dark');
        }

        themeToggle.addEventListener('click', () => {
          const currentTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.body.setAttribute('data-theme', currentTheme);
          localStorage.setItem('theme', currentTheme);
          if (icon) {
            icon.classList.toggle('fa-sun', currentTheme === 'dark');
            icon.classList.toggle('fa-moon', currentTheme !== 'dark');
          }
        });
      }
    </script>
  </body>
</html>
