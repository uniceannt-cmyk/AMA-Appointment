<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Office</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="registrar.css">
    <script src="popup.js" defer></script>
  </head>

  <body>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <i class="fas fa-moon"></i>
    </button>

    <header>
      <h1>Registrar Office</h1>
      <nav>
        <a href="homepage.html">Home</a>
        <a href="index.html">Logout</a>
      </nav>
    </header>

    <section class="services">
      <h2>Available Services</h2>
      <div class="service-list">
        <div class="service-card">Enrollment Verification</div>
        <div class="service-card">Transcript Request</div>
        <div class="service-card">Student Records Update</div>
        <div class="service-card">Certificate of Enrollment</div>
      </div>
    </section>

    <section class="booking">
      <h2>Book an Appointment</h2>
      <form id="appointmentForm">
        
        <label for="service">Select Service:</label>
        <select name="service" id="service" required>
          <option value="" disabled selected>Select a service</option>
          <option value="Enrollment Verification">Enrollment Verification</option>
          <option value="Transcript Request">Transcript Request</option>
          <option value="Student Records Update">Student Records Update</option>
          <option value="Certificate of Enrollment">Certificate of Enrollment</option>
        </select>

        <label for="date">Choose Date:</label>
        <input type="date" name="date" id="date" class="date-time" required>

        <label for="time">Choose Time:</label>
        <select name="time" id="time" class="date-time" required>
          <option value="" disabled selected>Select time</option>
          <option value="8:00 AM">8:00 AM</option>
          <option value="8:30 AM">8:30 AM</option>
          <option value="9:00 AM">9:00 AM</option>
          <option value="9:30 AM">9:30 AM</option>
          <option value="10:00 AM">10:00 AM</option>
          <option value="10:30 AM">10:30 AM</option>
          <option value="11:00 AM">11:00 AM</option>
          <option value="11:30 AM">11:30 AM</option>
          <option value="12:00 PM">12:00 PM</option>
          <option value="12:30 PM">12:30 PM</option>
          <option value="1:00 PM">1:00 PM</option>
          <option value="1:30 PM">1:30 PM</option>
          <option value="2:00 PM">2:00 PM</option>
          <option value="2:30 PM">2:30 PM</option>
          <option value="3:00 PM">3:00 PM</option>
          <option value="3:30 PM">3:30 PM</option>
          <option value="4:00 PM">4:00 PM</option>
          <option value="4:30 PM">4:30 PM</option>
          <option value="5:00 PM">5:00 PM</option>
        </select>

        <input type="hidden" name="office" value="registrar">
        <button type="submit">Confirm Appointment</button>
      </form>
    </section>

    <script>
      // Restrict minimum selectable date to today
      const dateInput = document.getElementById('date');
      if (dateInput) {
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
      }

      // Handle Form Submission
      const bookingForm = document.getElementById('appointmentForm');
      bookingForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        try {
          const response = await fetch('/api/appointments', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(Object.fromEntries(new FormData(bookingForm))) 
          });

          const result = await response.json();

          if (!response.ok) { 
            AppPopup.show(result.error || 'Unable to book appointment.', 'error'); 
            return; 
          }

          AppPopup.show(result.message || 'Appointment booked successfully!', 'success', 'homepage.html');
        } catch (error) {
          AppPopup.show('Network error. Please try again later.', 'error');
        }
      });

      // Theme Toggle Logic
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        const icon = themeToggle.querySelector('i');
        
        if (icon) {
          icon.classList.toggle('fa-sun', savedTheme === 'dark');
          icon.classList.toggle('fa-moon', savedTheme !== 'dark');
        }

        themeToggle.addEventListener('click', () => {
          const currentTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.body.setAttribute('data-theme', currentTheme);
          localStorage.setItem('theme', currentTheme);
          if (icon) {
            icon.classList.toggle('fa-sun', currentTheme === 'dark');
            icon.classList.toggle('fa-moon', currentTheme !== 'dark');
          }
        });
      }
    </script>
  </body>
</html>
